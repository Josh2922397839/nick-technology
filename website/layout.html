<!doctype html>
<html lang="en-JM" data-page="{{page}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#06080c">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{url}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nick Technology Group">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="https://nicktechnologygroup.com/{{og_image}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/anybody-800-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/instrument-serif-italic-v1.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Everything needed for the first screen is inlined; the rest loads without blocking. -->
  <style>{{critical_css}}</style>
  <link rel="stylesheet" href="{{site_css}}" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="{{site_css}}"></noscript>
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.__NT)document.documentElement.classList.add('dock-on')},4000)</script>
  <script type="module" src="{{app_js}}"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Nick Technology Group",
    "alternateName": "NT Group",
    "image": "https://nicktechnologygroup.com/assets/img/wall-live.webp",
    "logo": "https://nicktechnologygroup.com/assets/img/nt-logo.png",
    "url": "https://nicktechnologygroup.com/",
    "telephone": "+1-876-465-5975",
    "email": "COMTEC_ZION@YAHOO.COM",
    "founder": { "@type": "Person", "name": "Nicholas Anderson" },
    "foundingDate": "2005",
    "priceRange": "$$",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "2 North Greater Portmore, East Ascot",
      "addressLocality": "Portmore",
      "addressRegion": "Saint Catherine",
      "addressCountry": "JM"
    },
    "openingHoursSpecification": [{
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
      "opens": "08:30",
      "closes": "18:30"
    }],
    "areaServed": ["Portmore", "Kingston", "Spanish Town", "Saint Catherine", "Jamaica"],
    "sameAs": ["https://www.facebook.com/NickTechnology/", "https://www.instagram.com/nicktechnology/"]
  }
  </script>
</head>
<body class="{{bodyclass}}">
{{> sprite}}
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}

<main id="main">
{{content}}
</main>

{{> footer}}
{{> dock}}
</body>
</html>
